name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build
        with:
          warnings-as-errors: 'true'

      - name: Unit tests
        run: dotnet test --no-build --filter "Category!=Integration" --verbosity normal

      - name: Format check
        run: dotnet format --verify-no-changes

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do
            if docker exec $(docker ps -q --filter ancestor=apache/kafka:latest) /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null; then
              echo "Kafka is ready"
              break
            fi
            echo "Waiting for Kafka... ($i/30)"
            sleep 5
          done

      - name: Integration tests
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          KAFKA_BROKERS: localhost:9092
        run: dotnet test --no-build --filter "Category=Integration" --verbosity normal
