version: 2

brokers:
  console:
    type: stdout

  rabbit:
    type: rabbitmq
    settings:
      uri: ${RABBITMQ_URL:-amqp://guest:guest@localhost:5672}
      exchange_name: webhooks

webhooks:
  test-ping:                      # GET /webhooks/test/ping
    path: test/ping
    methods: [GET]
    message:
      body: false
      headers: true
    to: console

  test-webhook:                   # POST /webhooks/test-webhook
    message:
      headers: true
    route:
      - when: { header: X-Event-Type, eq: ping }
        to: none                  # acknowledge and drop
      - to: [rabbit:events, console]   # fan-out
